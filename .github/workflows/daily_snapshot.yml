name: Daily Wealth Snapshot

on:
  schedule:
    # รันทุกวันเวลา 06:00 น. เวลาไทย (23:00 UTC ของวันก่อนหน้า)
    - cron: '0 23 * * *'
  workflow_dispatch: # ปุ่มกดรันเองได้ตลอดเวลาผ่าน GitHub

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run Snapshot Script
        run: python daily_snapshot.py
