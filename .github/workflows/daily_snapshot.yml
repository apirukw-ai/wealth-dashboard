name: Daily Wealth Snapshot

on:
  schedule:
    # รันทุกวันเวลา 06:00 น. เวลาไทย (23:00 UTC ของวันก่อนหน้า)
    - cron: '0 23 * * *'
  workflow_dispatch: # ปุ่มกดรันเองได้ตลอดเวลาผ่าน GitHub

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run Snapshot Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FIREBASE_BASE_URL: ${{ secrets.FIREBASE_BASE_URL }}
          FIREBASE_SECRET: ${{ secrets.FIREBASE_SECRET }}
        run: python daily_snapshot.py
