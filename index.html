<h1>🏠 Wealth Dashboard</h1>

<div id="totalWealth">Loading...</div>

<div id="mfcVal">-</div>
<div id="gpfVal">-</div>
<script src="https://cdn.jsdelivr.base/supabase-js@2
<script>

const SUPABASE_URL = 'https://iproktvvetsbxxmpptuj.supabase.co';
const SUPABASE_KEY = 'YOUR_ANON_KEY';

const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

async function loadDashboard() {

    let gpfTotal = 0;
    let mfcTotal = 0;

    // GPF
    const gpfRes = await fetch(
        'https://scb-e-class-default-rtdb.asia-southeast1.firebasedatabase.app/gpf_ports/my-gpf-4750131.json'
    );

    const gpfData = await gpfRes.json();

    gpfData.funds.forEach(f => {
        gpfTotal += Number(f.units) * Number(f.currentNav);
    });

    // MFC
    const { data } = await supabaseClient
        .from('mfc_policies')
        .select('*');

    data.forEach(p => {
        mfcTotal += Number(p.units) * Number(p.navToday);
    });

    const totalWealth = mfcTotal + gpfTotal;

    document.getElementById('totalWealth').innerText =
        '฿' + totalWealth.toLocaleString('en-US', {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });

    document.getElementById('mfcVal').innerText =
        'MFC LIVE : ฿' + mfcTotal.toLocaleString('en-US', {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });

    document.getElementById('gpfVal').innerText =
        'GPF LIVE : ฿' + gpfTotal.toLocaleString('en-US', {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });
}

loadDashboard();

</script>
